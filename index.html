<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Battery Dashboards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #030712; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tab-bar { display: flex; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); padding: 12px 28px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: center; justify-content: flex-start; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 10; flex-wrap: nowrap; overflow-x: auto; }
        .title { font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 800; margin-right: 14px; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        .tab-btn { background: rgba(255,255,255,0.04); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 8px 18px; border-radius: 10px; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.88rem; transition: all 0.25s ease; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .tab-btn:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-1px); }
        .tab-btn.all-active { background: linear-gradient(135deg, #6366f1, #38bdf8); color: #fff; border-color: #38bdf8; box-shadow: 0 0 16px rgba(99, 102, 241, 0.45); }
        .tab-btn.grading-active { background: linear-gradient(135deg, #10b981, #06b6d4); color: #fff; border-color: #10b981; box-shadow: 0 0 16px rgba(16, 185, 129, 0.45); }
        .tab-btn.hw-active { background: #f43f5e; color: #fff; border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        .tab-btn.fbh-active { background: #06b6d4; color: #fff; border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        .tab-btn.zte-active { background: #10b981; color: #fff; border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .right-actions { display: flex; gap: 10px; margin-left: auto; align-items: center; }
        iframe { flex: 1; width: 100%; border: none; background: #030712; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="title">OLT Battery Monitoring</div>
        <button class="tab-btn all-active" onclick="switchTab('all_battery.html', this, 'all-active')">⚡ All Monitored (667)</button>
        <button class="tab-btn" onclick="switchTab('battery_grading.html', this, 'grading-active')">📊 Battery Grading (11,687)</button>
        <button class="tab-btn" onclick="switchTab('hw_battery.html', this, 'hw-active')">Huawei (HW)</button>
        <button class="tab-btn" onclick="switchTab('fbh_battery.html', this, 'fbh-active')">Fiberhome (FBH)</button>
        <button class="tab-btn" onclick="switchTab('zte_battery.html', this, 'zte-active')">ZTE</button>
        <div class="right-actions">
            <a href="report/olt_battery_status_report.xlsx" class="tab-btn" style="text-decoration: none; color: #38bdf8; border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.08);" download title="Download Reconciled OLT Battery Status Report (11,687 Sites)">
                📊 Battery Report (Excel)
            </a>
            <a href="report/huawei_rectifier_current_report.xlsx" class="tab-btn" style="text-decoration: none; color: #34d399; border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.08);" download title="Download Nationwide Huawei Rectifier Current Excel Report (2,838 Sites)">
                📥 HW Rectifier (Excel)
            </a>
        </div>
    </div>
    <iframe id="dashboardFrame" src="all_battery.html"></iframe>
    <script>
        function switchTab(url, btn, activeClass) {
            document.getElementById('dashboardFrame').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('all-active', 'grading-active', 'hw-active', 'fbh-active', 'zte-active');
            });
            btn.classList.add(activeClass);
        }
    </script>
</body>
</html>
