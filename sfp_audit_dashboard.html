        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('tab-title').innerText = tabName.replace(/_/g, ' ');
            
            const data = dashboardData[tabName] || [];
            
            document.getElementById('kpi-count').innerText = data.length;
            document.getElementById('kpi-subs').innerText = data.reduce((sum, row) => sum + (row.Subscribers || 0), 0).toLocaleString();
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.Device}</td>
                    <td>${row.Model}</td>
                    <td>${row.UP_Port}</td>
                    <td>${row.Speed}</td>
                    <td>${row.DstDevice}</td>
                    <td>${row.Subscribers.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function exportExcel() {
            window.location.href = 'Broken_Dual_SFP_Analysis.xlsx';
        }
        
        // Init
        window.onload = () => {
            document.querySelector('.nav-item').click();
