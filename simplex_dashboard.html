                        <td><span class="badge bg-green">${row['A IfOper']}</span></td>
                        <td>${row['Mapped_DstSite'] || row['B Device']}</td>
                        ${designBadge}
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            const cleanTs = tsData.map(d => ({
                'Device': d['A Device'], 'Province': d['Province'], 'Speed': d['ifSpeed'], 
                'Status': d['A IfOper'], 'DstSite': d['Mapped_DstSite'] || d['B Device'],
                'By Design': d['Simplex By Design']
            }));
            const cleanBd = bdData.map(d => ({
                'Device': d['A Device'], 'Province': d['Province'], 'Speed': d['ifSpeed'], 
                'Status': d['A IfOper'], 'DstSite': d['Mapped_DstSite'] || d['B Device']
            }));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cleanTs), "True Simplex");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cleanBd), "Broken Dual");
            XLSX.writeFile(wb, "Simplex_Uplink_Analysis.xlsx");
        }

        renderTable();
    </script>
</body>
</html>
